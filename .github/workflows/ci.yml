name: CI

on:
  push:
    branches:
      - main
      - devel
      - "devel-*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - devel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Audit
        run: npm audit

      - name: Build package
        run: npm run build

      - name: Build library bundle
        run: npm run build:bundle

      - name: Smoke test library bundle
        run: npm run smoke:bundle

      - name: Check package artifact
        run: npm pack --dry-run
