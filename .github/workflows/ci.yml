name: CI

on:
  push:
    branches:
      - main
      - devel
      - "devel-*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - devel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Audit
        run: npm audit

      - name: Check package artifact
        run: npm pack --dry-run

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and system dependencies
        run: npx --no-install playwright install chromium firefox webkit --with-deps

      - name: Test and build
        run: npm test

      - name: Audit
        run: npm audit

      - name: Build ESM bundle and declarations
        run: npm run build:all

      - name: Verify type declarations
        run: npm run test:types

      - name: Smoke test bundle
        run: npm run smoke:bundle

      - name: Stage versioned assets
        run: npm run prepare:release-assets

      - name: Verify staged assets
        run: npm run verify:staged-assets

      - name: Test real browsers
        run: npm run test:browser
