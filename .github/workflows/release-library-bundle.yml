name: Release library bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag, such as v0.5.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-library-bundle:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || startsWith(inputs.tag_name, 'v')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Audit
        run: npm audit

      - name: Build package
        run: npm run build

      - name: Build library bundle
        run: npm run build:bundle

      - name: Smoke test library bundle
        run: npm run smoke:bundle

      - name: Prepare library bundle asset
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          case "${VERSION}" in
            "${PACKAGE_VERSION}"|"${PACKAGE_VERSION}".*) ;;
            *)
              echo "Release tag version (${VERSION}) must match package.json version (${PACKAGE_VERSION}) or add a dot suffix such as ${PACKAGE_VERSION}.1." >&2
              exit 1
              ;;
          esac

          mkdir -p release-assets
          cp "bundle/${PACKAGE_NAME}.mjs" "release-assets/${PACKAGE_NAME}-${VERSION}.mjs"
          cp "bundle/${PACKAGE_NAME}.mjs.map" "release-assets/${PACKAGE_NAME}-${VERSION}.mjs.map"

      - name: Upload library bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: release-assets/*
          overwrite_files: true
          draft: false
          prerelease: false
