name: Release library bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag, such as v0.5.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-library-bundle:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || startsWith(inputs.tag_name, 'v')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Audit
        run: npm audit

      - name: Build package
        run: npm run build

      - name: Build library bundle
        run: npm run build:bundle

      - name: Smoke test library bundle
        run: npm run smoke:bundle

      - name: Prepare library bundle asset
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: npm run prepare:release-assets

      - name: Upload library bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: release-assets/*
          overwrite_files: true
          draft: false
          prerelease: false
