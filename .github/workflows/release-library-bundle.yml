name: Release library bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag, such as v0.8.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-library-bundle:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || startsWith(inputs.tag_name, 'v')
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and system dependencies
        run: npx --no-install playwright install chromium firefox webkit --with-deps

      - name: Test
        run: npm test

      - name: Audit
        run: npm audit

      - name: Build ESM bundle and declarations
        run: npm run build:all

      - name: Verify type declarations
        run: npm run test:types

      - name: Smoke test bundle
        run: npm run smoke:bundle

      - name: Prepare versioned assets
        run: npm run prepare:release-assets

      - name: Verify staged assets
        run: npm run verify:staged-assets

      - name: Test real browsers
        run: npm run test:browser

      - name: Check package artifact
        run: npm pack --dry-run

      - name: Upload library bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: release-assets/*
          overwrite_files: true
          draft: false
          prerelease: false
